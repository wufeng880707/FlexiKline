name: Flutter Web

# Fork note:
# - Flutter 版本通过 .fvmrc 锁定，与 pubspec 的 SDK 约束（>=3.6.0 / Flutter >=3.27.0）保持一致。
# - gh-pages 构建产物推送目标由 COMMIT_SECRET 对应账号的仓库决定；如需推送到本 fork，
#   请确认 secret 指向 wufeng880707/FlexiKline 而非上游 FlexiKline/FlexiKline。
on:
  push:
    # branches:
    #  - main
    # Sequence of patterns matched against refs/tags
    tags:
      - "r*"
jobs:
  build:
    name: Build Web
    env:
      my_secret: ${{secrets.commit_secret}}
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc

      - run: flutter --version

      # 按照下面的顺序执行打包命令
      - run: |
          cd example
          flutter config --enable-web
          flutter pub get
          flutter build web --release

      - run: |
          cd example/build/web
          git init
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          git status
          # 目标仓库由 COMMIT_SECRET 决定（见文件头部 Fork note）
          git remote add origin https://${{secrets.commit_secret}}@github.com/${{ github.repository }}.git
          git checkout -b gh-pages
          git add --all
          git commit -m "update"
          git push origin gh-pages -f
